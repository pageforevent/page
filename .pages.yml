media: media

settings:
  content:
    merge: true
  commit:
    templates:
      update: "콘텐츠 수정: {path} (Pages CMS)"

content:
  - name: event-guide
    label: 사은 행사 안내
    type: file
    path: data.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: pageTitle
        label: 브라우저 제목
        type: string
        required: true
        description: 브라우저 탭에 표시되는 제목입니다.

      - name: headerTitle
        label: 화면 제목
        type: string
        required: true
        description: 광안대교 이미지 아래에 표시되는 제목입니다.

      - name: eyebrow
        label: 영문 상단 문구
        type: string
        required: true
        description: 화면 상단의 작은 영문 라벨입니다.

      - name: subtitle
        label: 소개 문구
        type: text
        required: true
        description: 메인 제목 아래에 표시되는 짧은 안내 문구입니다.

      - name: steps
        label: 안내 버튼
        type: object
        required: true
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{stepNum} · {title}"
        fields:
          - name: id
            label: 내부 ID
            type: string
            hidden: true

          - name: stepNum
            label: 단계 표시
            type: string
            required: true
            readonly: true
            description: 예) STEP 01

          - name: title
            label: 제목
            type: string
            required: true

          - name: tagline
            label: 영문 태그
            type: string
            required: true
            description: 카드 우측 상단에 표시되는 짧은 영문 문구입니다.

          - name: description
            label: 설명
            type: text
            required: true

          - name: buttonText
            label: 버튼 문구
            type: string
            required: true

          - name: link
            label: 기본 링크
            type: string
            required: true
            description: https://로 시작하는 전체 주소를 입력하세요.

          - name: link_android
            label: Android 전용 링크
            type: string
            description: 앱 설치 단계에서만 사용합니다. 비워두면 기본 링크를 사용합니다.

          - name: link_ios
            label: iOS 전용 링크
            type: string
            description: 앱 설치 단계에서만 사용합니다. 비워두면 기본 링크를 사용합니다.

          - name: target
            label: 링크 열기 방식
            type: string
            hidden: true

          - name: iconSvg
            label: 아이콘 SVG
            type: code
            hidden: true
            options:
              format: html
