<!DOCTYPE html>
<html lang="ko" data-time-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060B16">
    <title>사은 행사 안내</title>
    <link rel="icon" href="data:,">
    <script>
        (() => {
            const themes = ['morning', 'day', 'sunset', 'night'];
            const params = new URLSearchParams(location.search);
            const forcedTheme = params.get('theme');
            const hour = new Date().getHours();
            const autoTheme = hour >= 5 && hour < 11
                ? 'morning'
                : hour >= 11 && hour < 17
                    ? 'day'
                    : hour >= 17 && hour < 20
                        ? 'sunset'
                        : 'night';

            document.documentElement.dataset.timeTheme = themes.includes(forcedTheme)
                ? forcedTheme
                : autoTheme;

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const forcedPerformance = params.get('performance');
            const slowNetwork = connection?.saveData || /(^|-)2g$/.test(connection?.effectiveType || '');
            const lowEndDevice = Boolean(
                navigator.deviceMemory && navigator.deviceMemory <= 4
                && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4
            );
            const balancedDevice = Boolean(
                (window.devicePixelRatio >= 2 && window.matchMedia('(max-width: 820px)').matches)
                || (navigator.deviceMemory && navigator.deviceMemory <= 6)
                || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 6)
            );

            document.documentElement.dataset.performance = ['full', 'balanced', 'lite'].includes(forcedPerformance)
                ? forcedPerformance
                : slowNetwork || lowEndDevice
                    ? 'lite'
                    : balancedDevice
                        ? 'balanced'
                        : 'full';

            // CSS와 JavaScript를 내려받는 동안 CMS 데이터 요청을 먼저 시작합니다.
            window.__eventDataPromise = fetch('data.json', {
                cache: 'no-cache',
                credentials: 'same-origin'
            }).catch((error) => ({ __eventDataError: error }));
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-intro">
    <div class="app-container is-intro">
        <!-- 부산 랜드마크 일러스트 헤더 -->
        <header class="header" id="header-container">
            <div class="header-skeleton">
                <div class="skeleton-shimmer"></div>
            </div>
        </header>

        <!-- 스텝 카드 영역 -->
        <main class="step-list" id="step-container">
            <!-- JS를 통해 동적 생성 -->
        </main>

        <!-- 관리자 진입 푸터 -->
        <footer style="text-align: center; padding: 2.5rem 0 1.2rem; opacity: 0.4; transition: opacity 0.2s ease;" onmouseenter="this.style.opacity='0.9'" onmouseleave="this.style.opacity='0.4'">
            <a href="admin.html" style="color: var(--text-muted, #94A3B8); text-decoration: none; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.6rem; border-radius: 4px; border: 1px dashed rgba(255, 255, 255, 0.15);">
                <span>🔒</span>
                <span>관리자 모드</span>
            </a>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
